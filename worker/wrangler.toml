name = "main-cron"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Hourly payouts, six-hourly FOMO leaderboard sync.
[triggers]
crons = ["7 * * * *", "3 */6 * * *"]

[[kv_namespaces]]
binding = "MAIN_KV"
id = "6dcb1e6987f7492e895383f7c88c43d7"

[vars]
MAIN_LAUNCHER = "0xce0f3C1Be0836561A6F4aE8bA0df5B8AE1684dC4"
PAYOUT_MIN_ETH = "0.001"
